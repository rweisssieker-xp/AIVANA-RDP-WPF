[package]
name = "aivana_rust_rdp_client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
eframe = "0.34.2"
egui_extras = "0.34.2"
ironrdp = { version = "0.14.0", features = ["connector", "session", "graphics"] }
ironrdp-blocking = "0.8.0"
ironrdp-graphics = "0.7.0"
ironrdp-pdu = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sspi = { version = "0.18.0", features = ["network_client"] }
tokio-rustls = "0.26.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }
